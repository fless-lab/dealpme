name: dealpme

services:
  postgres-core:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dealpme_core
      POSTGRES_USER: dealpme_core
      POSTGRES_PASSWORD: dealpme_core
    ports: ["5432:5432"]
    volumes:
      - pg-core:/var/lib/postgresql/data
      - ./postgres/init/core.sql:/docker-entrypoint-initdb.d/core.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealpme_core"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-vdr:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dealpme_vdr
      POSTGRES_USER: dealpme_vdr
      POSTGRES_PASSWORD: dealpme_vdr
    ports: ["5433:5432"]
    volumes:
      - pg-vdr:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealpme_vdr"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-rps:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dealpme_rps
      POSTGRES_USER: dealpme_rps
      POSTGRES_PASSWORD: dealpme_rps
    ports: ["5434:5432"]
    volumes:
      - pg-rps:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealpme_rps"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dealpme
      MINIO_ROOT_PASSWORD: dealpme-secret
      # Chiffrement au repos côté serveur (SSE-S3). En local, MinIO tient lieu de KMS avec cette clé de
      # développement ; en production, un KMS géré (KES) fournit la clé et cette variable disparaît.
      MINIO_KMS_SECRET_KEY: "dealpme-local-key:+HEjxsiDJlHsK9AUFF8LOhwTj3qeHJiKYSBq13TWnPw="
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -ec "
      for attempt in $$(seq 1 60); do
        if mc alias set local http://minio:9000 dealpme dealpme-secret && mc ready local; then break; fi;
        sleep 2;
      done;
      mc ready local;
      mc mb --ignore-existing local/dealpme-vdr;
      mc mb --ignore-existing local/dealpme-identity;
      mc mb --ignore-existing local/dealpme-dossier;
      mc anonymous set none local/dealpme-vdr;
      mc anonymous set none local/dealpme-identity;
      mc anonymous set none local/dealpme-dossier"

  clamav:
    image: clamav/clamav:stable
    # Le moteur télécharge ses signatures au premier démarrage : compter deux à trois minutes avant
    # que le port 3310 réponde. L'API refuse tout dépôt tant que le moteur ne répond pas.
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    ports: ["3310:3310"]
    volumes:
      - clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  sms-inbox:
    profiles: [local]
    build:
      context: ..
      dockerfile: codebases/devtools/sms-inbox/Dockerfile
    environment:
      NODE_ENV: development
      SMS_INBOX_API_KEY: ${SMS_LOCAL_API_KEY:-dealpme-local-sms}
      SMS_INBOX_MAX_MESSAGES: 1000
      SMS_INBOX_TTL_MS: 3600000
    ports: ["127.0.0.1:8026:8026"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8026/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  registry-mock:
    profiles: [local]
    build:
      context: ..
      dockerfile: codebases/devtools/registry-mock/Dockerfile
    ports: ["127.0.0.1:8027:8027"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8027/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  clamav:
  pg-core:
  pg-vdr:
  pg-rps:
  redis:
  minio:
