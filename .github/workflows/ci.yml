name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint effectif (aucun avertissement toléré)
        run: npm run lint
      - name: Bibliothèques et tous les connecteurs
        run: npm run build:libs
      - name: Types de tous les workspaces
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Vulnérabilités élevées et critiques
        run: npm audit --audit-level=high
      - name: Builds RPS, API, worker et web
        run: npm run build:apps
      - name: Preuves de rejet des contrôles
        run: npm run ci:verify-gates
      - name: Smoke V1 sur une pile isolée avec ClamAV réel
        run: npm run ci:smoke
      - name: Résumé des contrôles exécutés
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node devX/ci-summary.mjs
      - name: Preuves de CI (sans comptes ni logs privés)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-artifacts/*.json
            qa/control-coverage.json
          if-no-files-found: error
          retention-days: 14
