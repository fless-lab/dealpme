name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Toute l'infrastructure (trois Postgres, Redis, MinIO, Mailpit) vient de infra/docker-compose.yml,
    # exactement comme en local : aucun conteneur de service GitHub en doublon sur les mêmes ports.
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Le build échoue sur toute vulnérabilité élevée ou critique dans les dépendances (exigence v0, section sécurité ; registre S08).
      - run: npm audit --audit-level=high
      # Vérification de fumée V1 contre une pile réelle (bases migrées, RLS, jeu de démonstration, API démarrée).
      - run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -base64 32)|; s|^FIELD_ENCRYPTION_KEY=.*|FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          docker compose -f infra/docker-compose.yml up -d
          for c in core vdr rps; do until docker exec dealpme-postgres-$c-1 pg_isready -U dealpme_$c >/dev/null 2>&1; do sleep 1; done; done
          set -a; . ./.env; set +a
          npm run db:migrate -w codebases/backend/api && (cd codebases/backend/api && npx drizzle-kit migrate --config drizzle.vdr.config.ts) && npm run db:migrate -w codebases/engine/rps
          docker exec -i dealpme-postgres-core-1 psql -U dealpme_core -d dealpme_core -v ON_ERROR_STOP=1 < codebases/backend/api/drizzle/core/rls.sql
          npm run db:seed -w codebases/backend/api
          npm run build -w codebases/backend/api -w codebases/engine/rps
          (cd codebases/backend/api && node --env-file=../../../.env dist/main.js > /tmp/api.log 2>&1 &)
          (cd codebases/engine/rps && node --env-file=../../../.env dist/main.js > /tmp/rps.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:4000/v1/events && break; sleep 1; done
          bash devX/smoke_v1.sh
