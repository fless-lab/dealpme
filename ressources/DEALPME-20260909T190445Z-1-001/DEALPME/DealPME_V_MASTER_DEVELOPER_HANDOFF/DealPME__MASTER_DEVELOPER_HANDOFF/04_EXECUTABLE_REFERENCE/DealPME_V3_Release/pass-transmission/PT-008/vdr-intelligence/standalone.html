atus": "RECONCILED"}], "disclaimer": "Rapprochement d’éléments de preuve synthétiques. Ne constitue ni un audit ni une certification des comptes."}, "versions": {"case_id": "PT-008", "comparisons": [{"document_id": "DOC-TRX-001", "from_version": "0.9", "to_version": "1.0", "material_changes": 2, "summary": ["Calendrier de diligence étendu de 10 jours.", "Étape de confirmation des consentements ajoutée."], "review_status": "HUMAN_REVIEW_REQUIRED"}, {"document_id": "DOC-COM-002", "from_version": "0.8", "to_version": "1.0", "material_changes": 1, "summary": ["Ajout d’un extrait de clause de changement de contrôle dans le spécimen."], "review_status": "HUMAN_REVIEW_REQUIRED"}]}, "redaction": {"case_id": "PT-008", "proposals": [{"document_id": "DOC-HR-001", "category": "PERSONAL_DATA", "count": 14, "status": "PROPOSED", "requires_human_publish": true}, {"document_id": "DOC-COM-002", "category": "CUSTOMER_IDENTITY", "count": 3, "status": "PROPOSED", "requires_human_publish": true}, {"document_id": "DOC-TAX-002", "category": "TAX_IDENTIFIER", "count": 4, "status": "PROPOSED", "requires_human_publish": true}], "rule": "AI proposes only. Human review and publish are mandatory; original is preserved."}};</script><script>const F=window.VDR_FIXTURE;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));const P=new URLSearchParams(location.search);let state={view:P.get('view')||'cockpit',folder:P.get('folder')||F.coverage.folders[0].folder,doc:F.documents.find(d=>d.document_id===(P.get('doc')||'DOC-COM-002'))||F.documents[0],aiTab:P.get('ai')||'summary',profile:'AUTHORIZED',search:'',zoom:100,docAnswer:'',roomAnswer:''};function notify(m){let n=document.createElement('div');n.textContent=m;n.style='position:fixed;right:18px;bottom:18px;background:#0d315a;color:white;padding:11px 14px;border-radius:6px;z-index:99;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.18)';document.body.appendChild(n) function nav(){return ['cockpit','documents','deallens','qa','issues','engagement','audit','access'].map(v=>`<button data-control-id="NAV_${v.toUpperCase()}" data-view="${v}" class="${state.view===v?'active':''}">${({cockpit:'Cockpit',documents:'Documents',deallens:'DealLens IA',qa:'Q&R',issues:'Risques',engagement:'Engagement',audit:'Audit',access:'Accès'})[v]}</button>`).join('')}
function base(content){$('#app').innerHTML=`<div class="app"><div class="top"><div class="brand">Deal<span>PME</span></div><div><div class="deal">${esc(F.case_id)} — ${esc(F.company)}</div><div class="sub">VDR Intelligence Workspace · démonstration synthétique</div></div><div class="topnav">${nav()}</div><div class="secure">🔒 VDR sécurisée · accès contrôlé</div></div><div class="dealbar"><div><div class="k">Phase</div><div class="v">Due Diligence</div></div><div><div class="k">Accès</div><div class="v">T2 — autorisé</div></div><div><div class="k">Rôle</div><div class="v">Acquéreur</div></div><div><div class="k">Progression</div><div class="progress"><i style="width:${F.coverage.overall_pct}%"></i></div></div><div><div class="k">Couverture</div><div class="v">${F.coverage.overall_pct} %</div></div><div style="margin-left:auto"><span class="pill green">DealLens permission-aware</span></div></div><div class="shell"><aside class="side"><input id="globalSearch" data-control-id="GLOBAL_SEARCH" placeholder="Rechercher dans la VDR" value="${esc(state.search)}"><div style="margin-top:12px">${F.coverage.folders.map(x=>`<button class="folder ${state.folder===x.folder?'active':''}" data-control-id="SELECT_FOLDER" data-folder="${esc(x.folder)}"><span>${esc(x.label)}</span><b>${x.documents}</b></button>`).join('')}</div><div class="coverage"><small>Couverture diligence</small><strong>${F.coverage.overall_pct} %</strong><small>Indicateur de complétude, pas une opinion d’audit.</small></div></aside><main class="main">${content}</main></div><div class="footer"><span>DealPME VDR · Données de démonstration synthétiques · lecture seule</span><span>Dissuasion · attribution · traçabilité — aucune garantie de prévention absolue des captures</span></div></div>`; bindBase()}
function bindBase(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{state.folder=b.dataset.folder;state.view='documents';render()});let gs=document.querySelector('#globalSearch');if(gs)gs.oninput=()=>{state.search=gs.value;state.view='documents';render()};}
function cockpit(){let high=F.risks.filter(r=>r.severity==='HIGH').length,open=F.risks.filter(r=>r.status!=='CLOSED').length;return `<div class="toolbar"><h1>Cockpit de diligence</h1><div class="spacer"></div><button class="btn" data-control-id="EXPORT_SUMMARY" data-action="export">Exporter la synthèse</button><button class="btn primary" data-control-id="OPEN_DEALLENS" data-view="deallens">Interroger DealLens</button></div><div class="grid cockpit"><div class="card"><h3>Couverture diligence</h3><div class="metric">${F.coverage.overall_pct} %</div><div class="muted">${F.documents.length} documents structurés</div></div><div class="card"><h3>Points ouverts</h3><div class="metric">${open}</div><div class="muted">${high} critique(s)/élevé(s)</div></div><div class="card"><h3>Q&R</h3><div class="metric">${F.qa.length}</div><div class="muted">${F.qa.filter(q=>q.status==='OPEN').length} en attente</div></div><div class="card"><h3>Engagement</h3><div class="metric">${F.engagement.buyer_groups[0].score}</div><div class="muted">Pulse descriptif · non prédictif</div></div></div><div class="issues" style="margin-top:14px"><div class="card"><h3>Couverture par domaine</h3>${F.coverage.folders.map(x=>`<div class="fact"><span>${esc(x.label)}</span><b>${x.coverage_pct}% · ${x.critical_gaps} gap(s)</b></div>`).join('')}</div><div class="card"><h3>Priorités suggérées</h3><ol style="font-size:12px;line-height:1.7;padding-left:18px"><li>Clore les Q&R financières ouvertes.</li><li>Confirmer les clauses de changement de contrôle.</li><li>Rapprocher dette nette, BFR et preuves fiscales.</li><li>Revoir les risques liés aux clients et fournisseurs.</li></ol><button class="btn primary" data-control-id="OPEN_ISSUE_RADAR" data-view="issues">Ouvrir l’Issue Radar</button></div></div><div class="card" style="margin-top:14px"><h3>Financial Tie-Out — rapprochement des preuves</h3>${F.tieout.items.map(x=>`<div class="fact"><span>${esc(x.metric)} · ${esc(x.source_a)} vs ${esc(x.source_b)}</span><b>${x.difference===0?'Réconcilié':'Écart '+x.difference+' '+x.unit}</b></div>`).join('')}<p class="muted">${esc(F.tieout.disclaimer)}</p></div>`}
function docWorkspace(){let docs=F.documents.filter(d=>d.folder===state.folder);if(!docs.length)docs=F.documents;if(state.search)docs=F.documents.filter(d=>(d.title+' '+d.document_id+' '+d.folder).toLowerCase().includes(state.search.toLowerCase()));let intel=F.intelligence.find(x=>x.document_id===state.doc.document_id)||F.intelligence[0];let content=F.contents[state.doc.document_id]||state.doc.summary;let linked=F.qa.filter(q=>q.document_id===state.doc.document_id);return `<div class="toolbar"><h1>${esc(F.coverage.folders.find(x=>x.folder===state.folder)?.label||'Documents')}</h1><div class="spacer"></div><button class="btn" data-control-id="COMPARE_VERSIONS" data-action="compare">Comparer versions</button><button class="btn" data-control-id="ADD_FAVORITE" data-action="favorite">Ajouter aux favoris</button></div><div class="workspace"><section class="doclist"><div class="head">Documents · ${docs.length}</div>${docs.map(d=>`<div class="docrow ${state.doc.document_id===d.document_id?'active':''}" data-control-id="SELECT_DOCUMENT" data-doc="${d.document_id}"><b>${esc(d.title)}</b><small>${esc(d.document_id)} · ${esc(d.status)} · ${d.pages} p. · ${d.download_allowed?'DL autorisé':'lecture seule'}</small></div>`).join('')}</section><section class="viewer"><div class="viewerbar"><b>${esc(state.doc.title)}</b><span class="pill green">${esc(state.doc.status)}</span><span style="margin-left:auto">1 / ${state.doc.pages}</span><button class="btn" data-control-id="ZOOM_OUT" data-action="zoomout">−</button><button class="btn" data-control-id="ZOOM_LEVEL">${state.zoom}%</button><button class="btn" data-control-id="ZOOM_IN" data-action="zoomin">+</button></div><div class="paperwrap"><article class="paper"><div class="watermark">CONFIDENTIEL · DEMO</div><h2>${esc(state.doc.title)}</h2><p class="muted" style="text-align:center">${esc(state.doc.document_id)} · Version ${esc(state.doc.version)} · ${esc(state.doc.date)}</p><hr><p>${esc(content).replace(/\n/g,'</p><p>')}</p><p class="highlight">Passage de démonstration : ce contenu est sélectionné pour illustrer la liaison entre preuve, risque et Q&R.</p><p><b>Important :</b> document synthétique — ne constitue ni une pièce officielle, ni une opinion DealPME.</p></article></div></section><aside class="ai"><div class="head">✦ DealLens IA <span class="pill green">BETA</span></div><div class="aitabs">${['summary','facts','risks','compare','qa'].map(t=>`<button data-control-id="AI_TAB_${t.toUpperCase()}" data-aitab="${t}" class="${state.aiTab===t?'active':''}">${({summary:'Résumé',facts:'Faits',risks:'Risques',compare:'Comparer',qa:'Q&R'})[t]}</button>`).join('')}</div><div class="aibody">${aiPanel(intel,linked)}</div></aside></div>`}
function aiPanel(i,linked){if(state.aiTab==='facts')return `<h3>Faits extraits</h3>${i.facts.map(f=>`<div class="fact"><span>${esc(f.label)}</span><b>${esc(f.value)}</b></div>`).join('')}<p class="muted">Chaque fait conserve sa provenance et doit être revu avant utilisation décisionnelle.</p>`;if(state.aiTab==='risks')return `<h3>Points d’attention</h3>${i.risks.length?i.risks.map(r=>`<div class="risk ${r.severity==='HIGH'?'high':''}"><b>${esc(r.title)}</b><div>${esc(r.severity)} · ${esc(r.status)}</div></div>`).join(''):'<div class="summary">Aucun risque directement lié dans le registre. Cela ne signifie pas absence de risque.</div>'}`;if(state.aiTab==='compare')return `<h3>Documents comparables</h3>${i.related_documents.map(d=>`<button class="qbtn" data-control-id="OPEN_RELATED_DOCUMENT" data-related="${d.document_id}">${esc(d.title)}</button>`).join('')||'<div class="muted">Aucun document comparable de même type.</div>'}<div class="summary">La comparaison V3 est sémantique et doit toujours conserver les versions et sources.</div>`;if(state.aiTab==='qa')return `<h3>Q&R liées</h3>${linked.map(q=>`<div class="risk"><b>${esc(q.qa_id)}</b> · ${esc(q.status)}<div>${esc(q.question)}</div></div>`).join('')||'<div class="muted">Aucune Q&R liée.</div>'}<button class="btn primary" data-control-id="DRAFT_QA_FROM_DOC" data-action="draftq">Rédiger une question à partir du document</button>`;return `${state.docAnswer?`<div class="summary"><b>Réponse DealLens</b><p>${esc(state.docAnswer)}</p><div class="muted">Source : ${esc(state.doc.document_id)} · p.1 · réponse synthétique de démonstration.</div></div>`:''}<div class="summary"><b>Synthèse du document</b><p>${esc(i.summary)}</p><div class="muted">Confiance : ${esc(i.confidence)} · Sources : document autorisé uniquement.</div></div><h3>Questions suggérées</h3>${i.suggested_questions.map(q=>`<button class="qbtn" data-control-id="AI_SUGGESTED_PROMPT" data-prompt="${esc(q)}">${esc(q)}</button>`).join('')}<div class="ask"><input id="askInput" data-control-id="AI_DOCUMENT_QUERY" placeholder="Posez une question sur ce document…"><button class="btn primary" data-control-id="AI_DOCUMENT_SEND" data-action="ask">Envoyer</button></div><p class="muted">DealLens est en lecture seule. Les réponses sont limitées aux documents auxquels vous avez accès et peuvent comporter des approximations.</p>`}
function issues(){return `<div class="toolbar"><h1>Issue Radar & Evidence Map</h1><div class="spacer"></div><button class="btn" data-control-id="FILTER_ISSUES" data-action="filterissues">Filtrer</button><button class="btn primary" data-control-id="CREATE_ISSUE" data-action="createissue">Créer un point de diligence</button></div><div class="issues"><div class="card"><h3>Registre des points</h3>${F.risks.map(r=>`<div class="issue-row"><span class="sev ${r.severity}">${esc(r.severity)}</span><div><b>${esc(r.title)}</b><div class="muted">${esc(r.category)} · ${esc(r.description)}</div></div><span>${esc(r.status)}</span><span>${r.evidence.length} preuve(s)</span></div>`).join('')}</div><div class="card"><h3>Impact transactionnel</h3><div class="fact"><span>Prix / ajustement</span><b>3 points</b></div><div class="fact"><span>SPA / garanties</span><b>2 points</b></div><div class="fact"><span>Condition suspensive</span><b>1 point</b></div><div class="fact"><span>Intégration</span><b>2 points</b></div><p class="muted">Catégorisation synthétique de démonstration, non analyse juridique.</p></div></div><div class="card" style="margin-top:14px"><h3>Evidence Map</h3><div class="nodebox">${F.evidence.nodes.slice(0,36).map(n=>`<div class="node ${n.type}"><b>${esc(n.type)}</b><br>${esc(n.label).slice(0,72)}</div>`).join('')}</div></div>`}
function qaView(){return `<div class="toolbar"><h1>Q&R Workbench</h1><div class="spacer"></div><button class="btn" data-control-id="IMPORT_QA" data-action="importqa">Importer questions</button><button class="btn primary" data-control-id="NEW_QA" data-action="newqa">Nouvelle question</button></div><div class="card"><table class="table"><thead><tr><th>ID</th><th>Catégorie</th><th>Question</th><th>Document</th><th>Responsable</th><th>Statut</th></tr></thead><tbody>${F.qa.map(q=>`<tr><td>${q.qa_id}</td><td>${esc(q.category)}</td><td>${esc(q.question)}</td><td>${esc(q.document_id||'—')}</td><td>${esc(q.assigned_to)}</td><td><span class="pill ${q.status==='OPEN'?'amber':'green'}">${esc(q.status)}</span></td></tr>`).join('')}</tbody></table></div><div class="card" style="margin-top:14px"><h3>Workflow recommandé</h3><p class="muted">Auteur → coordinateur questions → vendeur / expert → approbateur éventuel → publication. DealLens peut proposer un brouillon mais ne soumet jamais automatiquement.</p></div>`}
function engagement(){return `<div class="toolbar"><h1>Engagement Pulse</h1><div class="spacer"></div><span class="pill amber">Descriptif · non prédictif</span></div><div class="grid cockpit">${F.engagement.buyer_groups.map(g=>`<div class="card"><h3>${esc(g.name)}</h3><div class="metric">${g.score}</div><div class="muted">Tendance ${esc(g.trend)} · ${g.docs_viewed_pct}% documents consultés</div><div class="fact"><span>Connexions 14j</span><b>${g.logins_14d}</b></div><div class="fact"><span>Q&R</span><b>${g.qa_count}</b></div><div class="fact"><span>Activité senior</span><b>${esc(g.senior_activity)}</b></div></div>`).join('')}</div><div class="summary" style="margin-top:14px">${esc(F.engagement.disclaimer)}</div>`}
function audit(){let ev=['DOCUMENT_VIEWED','DEALLENS_QUESTION','QA_DRAFTED','DOCUMENT_ACCESS_REVOKED','VDR_LOGIN','PERMISSION_CHANGED'];return `<div class="toolbar"><h1>Audit & traçabilité</h1><div class="spacer"></div><button class="btn" data-control-id="EXPORT_AUDIT" data-action="exportaudit">Exporter le journal</button></div><div class="card"><div class="auditline"><b>Horodatage</b><b>Acteur</b><b>Événement</b><b>Objet</b></div>${ev.map((e,i)=>`<div class="auditline"><span>06/09/2026 0${9+i}:2${i}</span><span>USER-DEMO-${i+1}</span><span>${e}</span><span>${i%2?'DOC-FIN-003':'PT-001'}</span></div>`).join('')}</div><div class="summary" style="margin-top:14px">Les journaux ne doivent pas contenir le contenu confidentiel des documents ni les données d’identité sensibles.</div>`}
function access(){return `<div class="toolbar"><h1>Accès & Clean Team</h1><div class="spacer"></div><button class="btn primary" data-control-id="MANAGE_ACCESS" data-action="manageaccess">Gérer les accès</button></div><div class="grid cockpit"><div class="card"><h3>Transaction Team</h3><div class="metric">8</div><div class="muted">Accès T2 standard</div></div><div class="card"><h3>Clean Team</h3><div class="metric">3</div><div class="muted">Utilisateurs nommément autorisés</div></div><div class="card"><h3>Experts mandatés</h3><div class="metric">2</div><div class="muted">Accès limité et expirant</div></div><div class="card"><h3>Accès révoqués</h3><div class="metric">1</div><div class="muted">Révocation immédiate attendue</div></div></div><div class="card" style="margin-top:14px"><table class="table"><thead><tr><th>Groupe</th><th>Périmètre</th><th>DealLens</th><th>Téléchargement</th></tr></thead><tbody>${F.access.groups.map(g=>`<tr><td>${esc(g.group)}</td><td>${esc(g.scope)}</td><td>${esc(g.ai)}</td><td>${esc(g.download)}</td></tr>`).join('')}</tbody></table></div><div class="summary" style="margin-top:14px"><b>Disclosure Firewall :</b> le filtre de permission doit être exécuté avant toute récupération de contenu par l’IA. Un utilisateur ne doit jamais pouvoir inférer l’existence d’un document auquel il n’a pas accès.</div>`}
function deallens(){return `<div class="toolbar"><h1>DealLens IA — recherche transversale autorisée</h1><div class="spacer"></div><span class="pill green">Lecture seule</span></div><div class="issues"><div class="card"><h3>Interroger la VDR</h3><div class="summary">DealLens recherche uniquement dans les documents accessibles à votre profil. Chaque conclusion significative doit conserver une citation vers la source.</div>${state.roomAnswer?`<div class="summary"><b>Réponse DealLens</b><p>${esc(state.roomAnswer)}</p><div class="muted">Citations : DOC-FIN-003 p.1 · DOC-FIN-005 p.1 · sources autorisées uniquement.</div></div>`:''}${F.deallens.room_prompts.map(q=>`<button class="qbtn" data-control-id="AI_ROOM_PROMPT" data-roomprompt="${esc(q)}">${esc(q)}</button>`).join('')}<div class="ask"><input id="roomAsk" data-control-id="AI_ROOM_QUERY" placeholder="Ex. Quels contrats exigent un consentement au changement de contrôle ?"><button class="btn primary" data-control-id="AI_ROOM_SEND" data-action="analyze_room">Analyser</button></div></div><div class="card"><h3>Garde-fous</h3>${Object.entries(F.deallens.policy).map(([k,v])=>`<div class="fact"><span>${esc(k)}</span><b>${v?'Oui':'Non'}</b></div>`).join('')}<p class="muted">Une réponse sans preuve suffisante doit signaler l’insuffisance plutôt que compléter par supposition.</p></div></div>`}
function render(){let c=state.view==='cockpit'?cockpit():state.view==='documents'?docWorkspace():state.view==='issues'?issues():state.view==='qa'?qaView():state.view==='engagement'?engagement():state.view==='audit'?audit():state.view==='access'?access():deallens();base(c);if(state.view==='documents'){document.querySelectorAll('[data-doc]').forEach(x=>x.onclick=()=>{state.doc=F.documents.find(d=>d.document_id===x.dataset.doc);render()});document.querySelectorAll('[data-aitab]').forEach(x=>x.onclick=()=>{state.aiTab=x.dataset.aitab;render()});document.querySelectorAll('[data-related]').forEach(x=>x.onclick=()=>{let d=F.documents.find(d=>d.document_id===x.dataset.related);if(d){state.doc=d;state.folder=d.folder;render()}});document.querySelectorAll('[data-prompt]').forEach(x=>x.onclick=()=>{let a=document.querySelector('#askInput');if(a)a.value=x.dataset.prompt});document.querySelectorAll('[data-roomprompt]').forEach(x=>x.onclick=()=>{let a=document.querySelector('#roomAsk');if(a)a.value=x.dataset.roomprompt});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handleAction(b.dataset.action));}}
function handleAction(a){if(a==='export')notify('Synthèse exportée — démonstration');else if(a==='compare'){state.aiTab='compare';notify('Mode comparaison ouvert');render()}else if(a==='favorite')notify('Document ajouté aux favoris');else if(a==='zoomout'){state.zoom=Math.max(60,state.zoom-10);render()}else if(a==='zoomin'){state.zoom=Math.min(180,state.zoom+10);render()}else if(a==='draftq'){state.view='qa';notify('Brouillon Q&R créé — soumission humaine requise');render()}else if(a==='ask'){let q=document.querySelector('#askInput')?.value||'la question';state.docAnswer=`Analyse de démonstration pour « ${q} ». ${F.intelligence.find(i=>i.document_id===state.doc.document_id)?.summary||''} Vérifiez les citations avant utilisation.`;render()}else if(a==='filterissues')notify('Filtres de risques appliqués — démonstration');else if(a==='createissue')notify('Nouveau point de diligence créé en brouillon');else if(a==='importqa')notify('Import Q&R simulé');else if(a==='newqa')notify('Nouvelle question créée en brouillon');else if(a==='exportaudit')notify('Journal d’audit exporté — démonstration');else if(a==='manageaccess')notify('Gestion des accès ouverte — action soumise à autorisation renforcée');else if(a==='analyze_room'){let q=document.querySelector('#roomAsk')?.value||'la question';state.roomAnswer=`Analyse transversale de démonstration pour « ${q} ». Les résultats sont limités aux pièces autorisées ; tout fait matériel doit être confirmé par les citations.`;render()}}
render();</script></body></html>
