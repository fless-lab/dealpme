function vdrGate(){
  const p=profile();
  if(p.revoked) return ['ACCESS_REVOKED','Accès révoqué','Cet accès VDR a été révoqué. Toute URL de document active doit être invalidée dans le délai cible.'];
  if(!p.authenticated) return ['LOGIN_REQUIRED','Connexion requise',`Connectez-vous ou créez un compte. La destination ${state.fixture.case_id} doit être conservée après authentification.`];
  if(!p.qualified) return ['QUALIFICATION_REQUIRED','Qualification requise','Complétez la qualification acquéreur et la capacité d’exécution avant toute admission.'];
  if(!p.admitted) return ['ADMISSION_REQUIRED','Admission au cercle requise','Soumettez une demande d’admission. Pour une cession de titres, l’admission reste une décision humaine.'];
  if(!p.nda_executed) return ['NDA_REQUIRED','Accord de confidentialité requis','Exécutez l’accord de confidentialité admissible avant tout accès détaillé.'];
  if(!p.t2_granted) return ['T2_GRANT_REQUIRED','Accès T2 non accordé','Votre NDA est enregistré, mais l’accès détaillé T2 n’a pas encore été accordé.'];
  if(!p.seller_approved) return ['SELLER_APPROVAL_REQUIRED','Autorisation du cédant requise','Le cédant ou son conseil doit accorder l’accès à la VDR pour ce dossier.'];
  return null;
}

function handleControl(id, payload={}){
  const c=state.fixture.interaction_contracts.find(x=>x.control_id===id); if(!c){toast('Contrôle non référencé',id,'error');return}
  audit(c.audit_event,{control_id:id});

  switch(c.action){
    case 'SHOW_TAB': routeTab(c.target);break;
    case 'OPEN_VDR': window.open('./vdr-intelligence/standalone.html','_blank'); audit('VDR_INTELLIGENCE_OPENED'); break;
    case 'TOGGLE_FAVORITE': state.favorite=!state.favorite;toast(state.favorite?'Ajouté aux favoris':'Retiré des favoris',state.favorite?`${state.fixture.case_id} est enregistré dans votre sélection.`:`${state.fixture.case_id} a été retiré de votre sélection.`);renderHeader();break;
    case 'REQUEST_CONTACT': state.contactRequested=true;toast('Demande enregistrée','Le contact est simulé : aucun message réel n’est envoyé.');renderHeader();renderTab();break;
    case 'EXPRESS_INTEREST': state.interestRecorded=true;toast('Intérêt enregistré','Manifestation d’intérêt synthétique créée et journalisée.');renderTab();break;
    case 'REQUEST_MEETING': state.meetingRequested=true;toast('Réunion demandée','Demande de réunion management ajoutée au workflow de démonstration.');renderTab();break;
    case 'OPEN_DOCUMENT': openDocument(payload.documentId);break;
    case 'DOWNLOAD_DOCUMENT': attemptDownload(payload.documentId);break;
    case 'ASK_QUESTION': createQuestion();break;
    case 'FILTER': renderTab();break;
    case 'SET_PROFILE': state.profile=payload.profile;toast('Profil de test changé',state.fixture.interaction_profiles[state.profile].label);audit('DEV_PROFILE_CHANGED',{new_profile:state.profile}); if(state.tab==='vdr'){const g=vdrGate(); if(g){closeVdr(); showGate('OPEN_VDR')}} else {renderShell(true)}break;
    case 'NAVIGATE_REFERENCE': routeTab(c.target);break;
    case 'OUT_OF_FIXTURE_SCOPE': state.modal={kind:'scope',title:`Hors périmètre du fixture ${state.fixture.case_id}`,message:`La route cible ${c.target} appartient à la plateforme complète. Le contrôle répond ici par un état explicite plutôt que par un lien mort.`};renderModal();break;
    case 'CLOSE_VDR': closeVdr();break;
    case 'CLOSE_MODAL': state.modal=null;renderModal();break;
    case 'SELECT_FOLDER': state.selectedFolder=payload.folder;renderVdrDocList();break;
    case 'SELECT_DOCUMENT': selectVdrDoc(payload.documentId);break;
    case 'FILTER_INPUT': break;

    case 'INPUT_TEXT': break;
  }

async function openDocument(id){
  const d=state.fixture.documents.find(x=>x.document_id===id); if(!d){toast('Document introuvable',id,'error');return}
  if(!allowed('AUTHORIZED')){showGate('OPEN_DOCUMENT');return}
  audit('DOCUMENT_VIEWED',{document_id:id}); state.selectedDoc=d; if(d.content){state.docContent=d.content}else{try{state.docContent=await fetch('./'+d.file_path).then(r=>r.text())}catch{state.docContent=d.summary}}
  state.modal={kind:'document',doc:d};renderModal();
}
function attemptDownload(id){const d=state.fixture.documents.find(x=>x.document_id===id);audit('DOWNLOAD_ATTEMPT',{document_id:id});if(!d?.download_allowed){toast('Téléchargement bloqué','Le téléchargement est désactivé par défaut pour cette pièce. La consultation reste journalisée dans le viewer.','warning');return}toast('Téléchargement simulé','Aucun fichier réel n’est téléchargé dans la référence.')}
function createQuestion(){state.modal={kind:'ask'};renderModal()}
function submitQuestion(){const el=$('#newQuestion');const txt=el?.value.trim()||'';if(!txt){toast('Question requise','Saisissez une question avant validation.','warning');return}const id=`QA-DEMO-${String(state.fixture.qa_threads.length+1).padStart(3,'0')}`;state.fixture.qa_threads.unshift({qa_id:id,category:'Nouvelle question',document_id:'DOC-FIN-003',question:txt,asked_by:'Acheteur — démo',assigned_to:'Cédant',status:'OPEN',visibility:'ALL_AUTHORIZED',asked_at:new Date().toISOString(),answer:null,attachments:[]});audit('QUESTION_CREATED',{qa_id:id});state.modal=null;renderModal();toast('Question créée',`${id} a été ajouté au fil de démonstration.`);if(state.tab==='qa')renderTab()}
function renderModal(){const slot=$('#modalSlot');if(!state.modal){slot.innerHTML='';return}const md=state.modal;if(md.kind==='gate'){slot.innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>${esc(md.title)}</h2><button class="closex" aria-label="Fermer" data-control-id="MODAL_CLOSE">×</button></div><div class="modal-body"><div class="notice warning"><strong>${esc(md.code)}</strong><br>${esc(md.message)}</div><p class="fine" style="margin-top:14px">Dans l’application de production, le contrôle d’autorisation doit être appliqué côté serveur. Ce modal n’est qu’une simulation de référence.</p></div><div class="modal-foot"><button class="btn closebtn" data-control-id="MODAL_CLOSE">Fermer</button></div></div></div>`}
  if(md.kind==='scope'){slot.innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>${esc(md.title)}</h2><button class="closex" data-control-id="MODAL_CLOSE">×</button></div><div class="modal-body"><div class="notice">${esc(md.message)}</div><p class="fine">Dans la plateforme cible, cette action doit router vers la surface indiquée par l’Interaction Registry.</p></div><div class="modal-foot"><button class="btn closebtn" data-control-id="MODAL_CLOSE">Fermer</button></div></div></div>`}
  if(md.kind==='document'){const d=md.doc;slot.innerHTML=`<div class="modal-backdrop"><div class="modal" style="width:min(930px,100%)"><div class="modal-head"><h2>${esc(d.title)}</h2><button class="closex" aria-label="Fermer" data-control-id="MODAL_CLOSE">×</button></div><div class="modal-body"><div class="grid two"><div><div class="notice"><strong>Viewer documentaire synthétique</strong><br>Filigrane requis · téléchargement ${d.download_allowed?'autorisé':'désactivé'} · ouverture journalisée.</div><pre style="white-space:pre-wrap;line-height:1.55;color:#47566e;background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:14px;max-height:430px;overflow:auto">${esc(state.docContent)}</pre></div><div class="card" style="box-shadow:none"><h3>Métadonnées</h3>${kv('Référence',d.document_id)}${kv('Dossier',d.folder)}${kv('Statut',d.status)}${kv('Date',d.date)}${kv('Version',d.version)}${kv('Pages',d.pages)}${kv('Accès',d.tier)}${kv('Téléchargement',d.download_allowed?'Oui':'Non')}</div></div></div><div class="modal-foot"><button class="btn" data-control-id="DOWNLOAD_DOCUMENT" data-document-id="${d.document_id}">Télécharger</button><button class="btn closebtn" data-control-id="MODAL_CLOSE">Fermer</button></div></div></div>`}
  if(md.kind==='ask'){slot.innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>Poser une question de diligence</h2><button class="closex" data-control-id="MODAL_CLOSE">×</button></div><div class="modal-body"><label class="fine" for="newQuestion">Question</label><textarea id="newQuestion" data-control-id="QUESTION_TEXT_INPUT" class="textarea" rows="5" style="width:100%;margin-top:6px" placeholder="Ex. Pouvez-vous documenter le renouvellement du contrat client principal ?"></textarea><p class="fine">Ce formulaire crée uniquement un état local de démonstration. En production : attribution, visibilité, pièce liée et audit sont obligatoires.</p></div><div class="modal-foot"><button class="btn closebtn" data-control-id="MODAL_CLOSE">Annuler</button><button class="btn primary" id="submitQuestion" data-control-id="QUESTION_SUBMIT">Créer la question</button></div></div></div>`}
  $$('[data-control-id]',slot).forEach(el=>el.addEventListener('click',()=>handleControl(el.dataset.controlId,{documentId:el.dataset.documentId})));
  $('#newQuestion',slot)?.addEventListener('input',e=>audit('QUESTION_TEXT_CHANGED',{control_id:'QUESTION_TEXT_INPUT',length:e.target.value.length}));
}
function renderVdr(){
  const f=state.fixture; document.querySelector('#app').innerHTML=`<div class="vdr-shell"><div class="vdr-top"><button class="back-vdr" id="backVdr" data-control-id="VDR_BACK">← Dossier</button><img class="logo-mini" src="./assets/dealpme-logo.jpg" alt="DealPME"><div class="sep"></div><div class="vdr-title"><strong>${esc(f.case_id)} · ${esc(f.master.company)}</strong><small>VDR synthétique · accès autorisé · ${f.documents.length} documents · téléchargement désactivé par défaut</small></div><span class="pill green">Session T2</span></div><div class="vdr-grid"><aside class="folder-pane"><input id="vdrSearch" class="input vdr-search" data-control-id="VDR_SEARCH" placeholder="Rechercher"><h3 style="color:var(--navy);font-size:13px">Dossiers</h3>${f.vdr.folders.map(folder=>`<button class="folder-item ${state.selectedFolder===folder?'active':''}" data-control-id="VDR_SELECT_FOLDER" data-folder="${esc(folder)}"><span>${esc(folder.replace(/^\d+_/,'').replace(/_/g,' '))}</span><b>${f.documents.filter(d=>d.folder===folder).length}</b></button>`).join('')}<div class="security-note">${esc(f.ui_copy_contract.vdr_protection_copy)}</div></aside><section class="doc-pane"><div id="vdrDocList"></div></section><aside class="detail-pane"><div id="vdrDetail"></div></aside></div></div><div class="toast-host"></div><div id="modalSlot"></div>`;
  $('#backVdr').addEventListener('click',()=>handleControl('VDR_BACK')); $$('.folder-item').forEach(b=>b.addEventListener('click',()=>handleControl('VDR_SELECT_FOLDER',{folder:b.dataset.folder}))); $('#vdrSearch').addEventListener('input',()=>{audit('FILTER_APPLIED',{control_id:'VDR_SEARCH'});renderVdrDocList()}); renderVdrDocList();
}
function renderVdrDocList(){const q=$('#vdrSearch')?.value.toLowerCase()||'';let docs=state.fixture.documents.filter(d=>d.folder===state.selectedFolder);if(q)docs=state.fixture.documents.filter(d=>(d.title+d.document_id+d.folder).toLowerCase().includes(q));const host=$('#vdrDocList');host.innerHTML=`<div class="section-title"><div><h2>${esc(state.selectedFolder.replace(/^\d+_/,'').replace(/_/g,' '))}</h2><p>${docs.length} document(s) · consultation journalisée</p></div></div>${docs.map(d=>`<div class="vdr-doc ${state.selectedDoc?.document_id===d.document_id?'active':''}"><button data-control-id="VDR_SELECT_DOCUMENT" data-vdr-doc="${d.document_id}"><div class="doc-title">${esc(d.title)}</div><div class="doc-sub">${esc(d.document_id)} · ${esc(d.status)} · ${d.pages} p.</div></button><span class="pill">${d.download_allowed?'DL autorisé':'Lecture seule'}</span></div>`).join('')||'<div class="empty">Aucun document.</div>'}`;$$('[data-vdr-doc]').forEach(b=>b.addEventListener('click',()=>handleControl('VDR_SELECT_DOCUMENT',{documentId:b.dataset.vdrDoc})));if(!state.selectedDoc && docs[0])selectVdrDoc(docs[0].document_id,false)}
async function selectVdrDoc(id,rerender=true){const d=state.fixture.documents.find(x=>x.document_id===id);state.selectedDoc=d;state.docContent=d.content||await fetch('./'+d.file_path).then(r=>r.text()).catch(()=>d.summary);audit('DOCUMENT_VIEWED',{document_id:id,surface:'VDR'});if(rerender)renderVdrDocList();const qa=state.fixture.qa_threads.filter(q=>q.document_id===id);$('#vdrDetail').innerHTML=`<div class="viewer"><div class="viewer-watermark">DEALPME · ${state.profile} · ${state.fixture.case_id} · SYNTHÉTIQUE</div><div class="viewer-content">${esc(state.docContent)}</div></div><div class="doc-meta-list" style="margin-top:14px">${kv('Référence',d.document_id)}${kv('Date',d.date)}${kv('Statut',d.status)}${kv('Téléchargement',d.download_allowed?'Autorisé':'Désactivé')}<div class="split-actions" style="margin-top:10px"><button class="btn small" id="vdrDownload" data-control-id="DOWNLOAD_DOCUMENT">Télécharger</button><button class="btn small primary" id="vdrAsk" data-control-id="ASK_QUESTION">Poser une question</button></div></div><div class="vdr-qa"><h3 style="color:var(--navy)">Q&R liées (${qa.length})</h3>${qa.slice(0,3).map(qaCard).join('')||'<div class="qa-empty">Aucune question liée.</div>'}</div>`;$('#vdrDownload').addEventListener('click',()=>handleControl('DOWNLOAD_DOCUMENT',{documentId:id}));$('#vdrAsk').addEventListener('click',()=>handleControl('ASK_QUESTION'));$$('[data-control-id="OPEN_DOCUMENT"]',$('#vdrDetail')).forEach(b=>b.addEventListener('click',()=>openDocument(b.dataset.documentId)))}
window.addEventListener('hashchange',()=>{const h=(location.hash||'#overview').slice(1);if(h==='vdr')openVdr(true);else if(['overview','financials','transaction','risks','documents','qa'].includes(h)){state.tab=h; if($('#tabSlot')){renderTabs();renderTab()}}});
load().catch(err=>{document.querySelector('#app').innerHTML=`<div style="padding:40px;font-family:Arial"><h1>Erreur de chargement</h1><pre>${esc(err.stack||err)}</pre></div>`});
</script></body></html>
